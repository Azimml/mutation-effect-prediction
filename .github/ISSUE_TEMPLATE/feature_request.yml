name: Feature request
description: Suggest an improvement to the modeling or pipeline.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What limitation are you hitting, or what would this enable?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Preprocessing / data filtering
        - Split / leakage handling
        - Baseline model
        - CNN model
        - Evaluation / interpretation
        - CLI / packaging
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
