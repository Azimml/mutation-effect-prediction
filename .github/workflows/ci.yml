name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU torch so the sequence-encoding tests run (not just skip).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Deps needed to import the tested modules (pysam is NOT required:
          # it's imported lazily inside the I/O functions we don't unit-test).
          pip install numpy pandas scikit-learn matplotlib
          # Pinned ruff so local and CI agree on lint rules.
          pip install "ruff==0.16.0" pytest
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run tests
        run: pytest
